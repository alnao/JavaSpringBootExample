# Configurazione profilo dev - Development
spring:
  # Configurazione logging dettagliata per development
  jpa:
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true
        # Logging SQL dettagliato
        '[show_sql]': true
        '[use_sql_comments]': true
        '[type]': trace

# Logging dettagliato per development
logging:
  level:
    '[it.alnao.springbootexample]': DEBUG
    '[org.springframework.web]': DEBUG
    '[org.springframework.security]': DEBUG
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE

# Configurazione Actuator esposta per development
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      show-components: always

# Configurazione export annotazioni per development (frequenza alta)
gestione-annotazioni:
  export-annotazioni:
    enabled: false
#    cron-expression: "0 */5 * * * *"   # ogni 5 minuti per test rapidi

# Credenziali fisse per l'uso in locale (change openspec secret-sqlite e secret-kube).
# ATTENZIONE: valori PUBBLICI, versionati di proposito. Il profilo dev non va mai attivato in un
# deploy: i deploy forniscono le stesse variabili d'ambiente da una sorgente non versionata, e una
# variabile d'ambiente impostata prevale sempre su questi valori.
JWT_SECRET: myVeryLongSecretKeyForHS512ThatMustBeAtLeast512BitsLongToWorkProperly1234567890abcdefghijklmnopqrstuvwxyz
APP_USER_ADMIN_PASSWORD: admin
APP_USER_MODERATORE_PASSWORD: cattivo
APP_USER_ALNAO_PASSWORD: bellissimo
# profilo kube: Postgres e Mongo in locale
POSTGRES_PASSWORD: gestione_annotazioni_pass
MONGODB_URI: mongodb://admin:admin123@localhost:27017/gestioneannotazioni_db?authSource=admin
