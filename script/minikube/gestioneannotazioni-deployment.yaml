apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestioneannotazioni-app
  namespace: gestioneannotazioni
spec:
  replicas: 2 # Scalabilità: 2 pod
  selector:
    matchLabels:
      app: gestioneannotazioni-app
  template:
    metadata:
      labels:
        app: gestioneannotazioni-app
    spec:
      containers:
        - name: gestioneannotazioni
          image: alnao/gestioneannotazioni:latest
          env:
            # nomi delle variabili allineati ad application-kube.yml e al docker-compose.yml di root
            - name: POSTGRES_URL
              value: jdbc:postgresql://postgres:5432/gestioneannotazioni
            # credenziali dal Secret gestioneannotazioni-credenziali creato da start-all.sh (change openspec secret-kube)
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: POSTGRES_PASSWORD
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_PASSWORD
            # composto dalle due variabili precedenti (Kubernetes risolve $(NOME) fra variabili gia' definite)
            - name: MONGODB_URI
              value: mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongo:27017/gestioneannotazioni_db?authSource=admin
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: JWT_SECRET
            - name: APP_USER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: APP_USER_ADMIN_PASSWORD
            - name: APP_USER_MODERATORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: APP_USER_MODERATORE_PASSWORD
            - name: APP_USER_ALNAO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: APP_USER_ALNAO_PASSWORD
            - name: KAFKA_BROKER_URL
              value: kafka-service:9092
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gestioneannotazioni-app
  namespace: gestioneannotazioni
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: gestioneannotazioni-app
