apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: gestioneannotazioni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.0
          env:
            # credenziali dal Secret gestioneannotazioni-credenziali creato da start-all.sh (change openspec secret-kube)
            - name: ME_CONFIG_MONGODB_ADMINUSERNAME
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_USERNAME
            - name: ME_CONFIG_MONGODB_ADMINPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_PASSWORD
            # composto dalle due variabili precedenti (Kubernetes risolve $(NOME) fra variabili gia' definite)
            - name: ME_CONFIG_MONGODB_URL
              value: mongodb://$(ME_CONFIG_MONGODB_ADMINUSERNAME):$(ME_CONFIG_MONGODB_ADMINPASSWORD)@mongo:27017/
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_EXPRESS_USERNAME
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_EXPRESS_PASSWORD
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  namespace: gestioneannotazioni
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30082
  selector:
    app: mongo-express
