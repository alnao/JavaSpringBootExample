apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: gestioneannotazioni
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:4.4
          env:
            - name: MONGO_INITDB_DATABASE
              value: gestioneannotazioni_db
            # credenziali dal Secret gestioneannotazioni-credenziali creato da start-all.sh (change openspec secret-kube)
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gestioneannotazioni-credenziali
                  key: MONGO_ROOT_PASSWORD
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: gestioneannotazioni
spec:
  ports:
    - port: 27017
  selector:
    app: mongo
